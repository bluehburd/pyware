[package]
name = "board-pad"
version = "1.0.0"
description = "Board Pad"
edition = "2021"

[lib]
name = "board_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
