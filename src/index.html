<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Board Pad</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fbfbfb;--bar:#f3f3f3;--fg:#1a1a1a;--bd:#d6d6d6;--acc:#0067c0;--note:#feff9c;--dot:#c4c4c4;--fs:16px;--ff:'Segoe UI',sans-serif}
[data-theme=dark]{--bg:#1e1e1e;--bar:#2b2b2b;--fg:#f0f0f0;--bd:#444;--acc:#4cc2ff;--note:#feff9c;--dot:#454545}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:14px 'Segoe UI',system-ui,sans-serif;color:var(--fg);background:var(--bg)}
body{display:flex;flex-direction:column;overflow:hidden}
#bar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--bd)}
#tabs{flex:none;display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:var(--bar);overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;flex:none;width:170px;padding:7px 6px 7px 12px;border-radius:8px 8px 0 0;white-space:nowrap;opacity:.75;cursor:default}
.tab:hover{background:rgba(128,128,128,.15);opacity:1}
.tab.on{background:var(--bg);opacity:1}
.tn{flex:1;overflow:hidden;text-overflow:ellipsis;outline:0}
.tn[contenteditable=true]{text-overflow:clip;background:var(--bar);padding:0 3px;border-radius:3px;cursor:text}
.tx{border:0;background:transparent;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:11px;opacity:.6}
.tx:hover{background:rgba(128,128,128,.3);opacity:1}
#tPlus{margin-bottom:3px;font-size:16px;padding:2px 10px}
#bar .t{font-weight:600;margin-right:10px}
#bar .sp{flex:1}
button,select,input{font:inherit;color:var(--fg)}
.b{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 10px;cursor:pointer}
.b:hover{background:rgba(128,128,128,.18)}
.b.on{background:var(--acc);color:#fff}
#vp{flex:1;position:relative;overflow:hidden;cursor:default;touch-action:none}
#vp.grab{cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.item{position:absolute}
.img{cursor:move}
.img img{width:100%;height:100%;display:block;pointer-events:none;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.note{background:var(--note);border:1px solid var(--bd);border-radius:0;color:#1a1a1a;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.nh{height:22px;flex:none;cursor:move;font-size:11px;opacity:.5;padding:4px 10px;user-select:none}
.nb{flex:1;min-height:0;overflow:auto;outline:0;padding:2px 12px 10px;font-size:var(--fs);font-family:var(--ff);color:#1a1a1a;white-space:pre-wrap;word-break:break-word;cursor:text}
.nb:empty:before{content:'Type here…';opacity:.45}
#cm{position:fixed;display:none;z-index:100000;flex-direction:column;gap:2px;min-width:200px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#cm .r{display:flex;align-items:center;gap:5px;padding:3px}
#cm .b{min-width:32px;text-align:center}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid rgba(128,128,128,.6);cursor:pointer;padding:0}
#cm input[type=color]{width:28px;height:22px;padding:0;border:0;background:none;cursor:pointer}
.pin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a8f 0,#d32f2f 45%,#8e1b1b 100%);box-shadow:2px 4px 6px rgba(0,0,0,.45);cursor:move}
.pin .rz{display:none!important}
#vp.pinmode,#vp.pinmode .item{cursor:crosshair}
#pm{position:fixed;display:none;z-index:100000;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.sw.cur{outline:2px solid var(--acc);outline-offset:2px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;border:1px solid rgba(128,128,128,.6)}
#sF{color:var(--acc);font-weight:600}
.sel{outline:2px solid var(--acc);outline-offset:2px}
.rz{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;background:var(--acc);border-radius:3px;cursor:nwse-resize;display:none}
.sel .rz{display:block}
#mq{position:absolute;border:1px solid var(--acc);background:rgba(0,103,192,.15);display:none;pointer-events:none}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;opacity:.45;pointer-events:none;line-height:1.8}
#st{padding:3px 12px;font-size:12px;background:var(--bar);border-top:1px solid var(--bd);display:flex;gap:18px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:99999}
#modal .box{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:20px 24px;width:360px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#modal h3{margin:0 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
select,input[type=number]{background:var(--bar);border:1px solid var(--bd);border-radius:6px;padding:4px 8px}
</style></head>
<body>
<div id="tabs"></div>
<div id="bar">
  <span class="t">📝 Board Pad</span>
  <button class="b" id="bNote" title="Add note (or double-click the board)">＋ Note</button>
  <button class="b" id="bPin" title="Pin mode: click the board to drop a pin. Ctrl+click two pins, then right-click to tie a red string (Esc to leave pin mode)">📌 Pin</button>
  <button class="b" id="bHand" title="Drag to move the board (or hold Space / middle mouse)">✋ Move board</button>
  <button class="b" id="bUndo" style="display:none" title="Reopen the tab you just closed">↩ Reopen tab</button>
  <button class="b" id="bFit" title="Reset view">⤢ Reset view</button>
  <span class="sp"></span>
  <button class="b" id="bOpen" title="Open board (Ctrl+O)">Open</button>
  <button class="b" id="bSave" title="Save board to file (Ctrl+S)">Save</button>
  <button class="b" id="bSet" title="Settings">⚙ Settings</button>
</div>
<div id="vp"><div id="world"></div><div id="mq"></div>
  <div id="hint">Just start typing to add a note<br>Paste or drop images anywhere<br>Ctrl + click or drag a box to select several<br>Space + drag (or ✋) moves the board</div></div>
<div id="st"><span id="sI"></span><span id="sS"></span><span id="sZ"></span><span id="sM"></span><span id="sF" style="margin-left:auto"></span></div>

<div id="modal"><div class="box">
  <h3>Settings</h3>
  <div class="row">Theme<select id="cT"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
  <div class="row">Background<select id="cB"><option value="dots">Dots</option><option value="grid">Grid</option><option value="none">Plain</option></select></div>
  <div class="row">Note font<select id="cF"><option>Segoe UI</option><option>Consolas</option><option>Georgia</option><option>Comic Sans MS</option><option>Arial</option></select></div>
  <div class="row">Note font size<input type="number" id="cS" min="10" max="48" style="width:70px"></div>
  <div class="row">Snap to grid<input type="checkbox" id="cG"></div>
  <div class="row">Autosave in this app<input type="checkbox" id="cA"></div>
  <div class="row"><button class="b" id="bClear" style="color:#c42b1c">Clear this tab</button><button class="b on" id="bClose">Done</button></div>
</div></div>
<div id="cm"><div class="r"><button class="b" data-c="bold" title="Bold (Ctrl+B)"><b>B</b></button><button class="b" data-c="italic" title="Italic (Ctrl+I)"><i>I</i></button><button class="b" data-c="underline" title="Underline (Ctrl+U)"><u>U</u></button><button class="b" data-c="strikeThrough" title="Strikethrough"><s>S</s></button></div>
  <div class="r" id="sws"></div>
  <div class="r">Custom colour <input type="color" id="cc" value="#d13438"></div>
  <div class="r"><button class="b" data-c="removeFormat" style="flex:1">Clear formatting</button></div></div>
<div id="pm"><button class="b" id="pTie"></button></div>
<input type="file" id="fOpen" accept=".json" hidden>

<script>
const $=s=>document.querySelector(s),vp=$('#vp'),world=$('#world'),mq=$('#mq');
let S={tabs:[],cur:null,n:0,items:[],strings:[],view:{x:80,y:80,z:1},cfg:{theme:'system',bg:'dots',ff:'Segoe UI',fs:16,snap:false,auto:true}};
let closed=[],sel=new Set(),dom={},drag=null,tool='select',space=false,zTop=1,mouse={x:300,y:200},tmr;
const KEY='boardpad.v1',get=id=>S.items.find(i=>i.id===id),snap=v=>S.cfg.snap?Math.round(v/24)*24:v;

function flush(){if(!S.cfg.auto)return;try{localStorage.setItem(KEY,JSON.stringify(snapshot()));$('#sM').textContent=''}catch(e){$('#sM').textContent='⚠ Storage full – use Save to keep your boards'}}
function save(){clearTimeout(tmr);tmr=setTimeout(flush,400);stat()}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
function stat(){$('#sI').textContent=S.items.length+' items';$('#sS').textContent=sel.size?sel.size+' selected':'';$('#sZ').textContent=Math.round(S.view.z*100)+'%';$('#hint').style.display=S.items.length?'none':'flex'}
function apply(){const v=S.view;world.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;const g=24*v.z,c=getComputedStyle(document.documentElement).getPropertyValue('--dot');
 vp.style.backgroundPosition=`${v.x}px ${v.y}px`;vp.style.backgroundSize=`${g}px ${g}px`;
 vp.style.backgroundImage=S.cfg.bg==='dots'?`radial-gradient(${c} 1.2px,transparent 1.5px)`:S.cfg.bg==='grid'?`linear-gradient(${c} 1px,transparent 1px),linear-gradient(90deg,${c} 1px,transparent 1px)`:'none';stat()}
function cfg(){const c=S.cfg,r=document.documentElement;
 r.dataset.theme=c.theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):c.theme;
 r.style.setProperty('--fs',c.fs+'px');r.style.setProperty('--ff',`'${c.ff}',sans-serif`);apply()}

function mk(it){const d=document.createElement('div');d.className='item '+it.type;d.dataset.id=it.id;
 if(it.type==='img'){const i=new Image();i.src=it.src;i.draggable=false;d.append(i)}
 else if(it.type==='pin'){}
 else{const h=document.createElement('div');h.className='nh';h.textContent='Note';const t=document.createElement('div');t.className='nb';t.contentEditable='true';t.spellcheck=false;t.innerHTML=it.html!=null?it.html:esc(it.text||'');
  t.oninput=()=>{if(t.innerHTML==='<br>')t.innerHTML='';it.html=t.innerHTML;delete it.text;save()};
  t.onpaste=e=>{const cd=e.clipboardData;if(cd&&[...cd.items].some(i=>i.kind==='file'&&i.type.startsWith('image/')))return;e.preventDefault();document.execCommand('insertText',false,cd.getData('text/plain'))};
  d.append(h,t)}
 const r=document.createElement('div');r.className='rz';d.append(r);world.append(d);dom[it.id]=d;place(it)}
function place(it){const d=dom[it.id];Object.assign(d.style,{left:it.x+'px',top:it.y+'px',width:it.w+'px',height:it.h+'px',zIndex:it.type==='pin'?1e6+it.z:it.z});d.classList.toggle('sel',sel.has(it.id))}
function refresh(){S.items.forEach(place);drawStrings();stat()}
function setSel(ids){sel=new Set(ids);refresh()}
function front(ids){ids.forEach(id=>{const it=get(id);it.z=++zTop;place(it)})}
function toWorld(cx,cy){const r=vp.getBoundingClientRect();return{x:(cx-r.left-S.view.x)/S.view.z,y:(cy-r.top-S.view.y)/S.view.z}}
function centre(){const r=vp.getBoundingClientRect();return toWorld(r.left+r.width/2,r.top+r.height/2)}
function add(it,p){it.id='i'+Date.now()+Math.random().toString(36).slice(2,6);const given=!!p,c0=given?0:(S.items.length%6)*10,sn=it.type==='pin'?(v=>v):snap;p=p||centre();
 it.x=sn(p.x-it.w/2+c0);it.y=sn(p.y-it.h/2+c0);it.z=++zTop;
 S.items.push(it);mk(it);setSel([it.id]);save();return it}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
function addNote(text,p){const it=add({type:'note',html:esc(text||''),w:260,h:200},p);if(!text)dom[it.id].querySelector('.nb').focus()}
function addImg(f,p){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let src=fr.result,W=im.naturalWidth,H=im.naturalHeight,m=1600;
 if(Math.max(W,H)>m&&f.type!=='image/gif'){const k=m/Math.max(W,H),c=document.createElement('canvas');c.width=W*k|0;c.height=H*k|0;c.getContext('2d').drawImage(im,0,0,c.width,c.height);src=c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',.9)}
 const w=Math.min(360,W);add({type:'img',src,w,h:w*H/W},p)};im.src=fr.result};fr.readAsDataURL(f)}
function del(){S.items=S.items.filter(i=>{if(sel.has(i.id)){dom[i.id].remove();delete dom[i.id];return false}return true});sel.clear();save();refresh()}

// ---- pointer: select, move, resize, marquee, pan
vp.addEventListener('pointerdown',e=>{
 if(e.button===1||tool==='hand'||space){drag={m:'pan',sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y};vp.setPointerCapture(e.pointerId);vp.classList.add('grab');e.preventDefault();return}
 if(e.button!==0)return;
 if(tool==='pin'&&!e.target.closest('.pin')){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();const p=toWorld(e.clientX,e.clientY);add({type:'pin',w:24,h:24,at:hostAt(p)},p);return}
 const d=e.target.closest('.item'),multi=e.ctrlKey||e.metaKey||e.shiftKey;
 if(document.activeElement&&document.activeElement.blur&&!e.target.closest('.nb'))document.activeElement.blur();
 if(d){const it=get(d.dataset.id);
  if(e.target.closest('.rz')){if(!sel.has(it.id))setSel([it.id]);drag={m:'rz',it,sx:e.clientX,sy:e.clientY,w:it.w,h:it.h};vp.setPointerCapture(e.pointerId);e.preventDefault();return}
  if(multi){sel.has(it.id)?sel.delete(it.id):sel.add(it.id);refresh();if(!sel.has(it.id))return}
  else if(!sel.has(it.id))setSel([it.id]);
  front([...sel]);if(e.target.closest('.nb'))return;
  drag={m:'mv',sx:e.clientX,sy:e.clientY,st:withPins().map(id=>{const i=get(id);return{i,x:i.x,y:i.y}})};vp.setPointerCapture(e.pointerId);e.preventDefault();
 }else{
  const base=multi?new Set(sel):new Set();if(!multi)setSel([]);
  const r=vp.getBoundingClientRect();drag={m:'mq',sx:e.clientX-r.left,sy:e.clientY-r.top,base,r};vp.setPointerCapture(e.pointerId);e.preventDefault()}
});
vp.addEventListener('pointermove',e=>{mouse={x:e.clientX,y:e.clientY};if(!drag)return;const z=S.view.z;
 if(drag.m==='pan'){S.view.x=drag.vx+e.clientX-drag.sx;S.view.y=drag.vy+e.clientY-drag.sy;apply()}
 else if(drag.m==='mv'){const dx=(e.clientX-drag.sx)/z,dy=(e.clientY-drag.sy)/z;drag.st.forEach(o=>{o.i.x=snap(o.x+dx);o.i.y=snap(o.y+dy);place(o.i)});drawStrings()}
 else if(drag.m==='rz'){const it=drag.it,nw=Math.max(60,drag.w+(e.clientX-drag.sx)/z);
  if(it.type==='img'){it.h=nw*drag.h/drag.w;it.w=nw}else{it.w=nw;it.h=Math.max(80,drag.h+(e.clientY-drag.sy)/z)}place(it)}
 else if(drag.m==='mq'){const x=e.clientX-drag.r.left,y=e.clientY-drag.r.top,L=Math.min(x,drag.sx),T=Math.min(y,drag.sy),W=Math.abs(x-drag.sx),H=Math.abs(y-drag.sy);
  Object.assign(mq.style,{display:'block',left:L+'px',top:T+'px',width:W+'px',height:H+'px'});
  const ids=new Set(drag.base);S.items.forEach(i=>{const b=dom[i.id].getBoundingClientRect(),l=b.left-drag.r.left,t=b.top-drag.r.top;
   if(l<L+W&&l+b.width>L&&t<T+H&&t+b.height>T)ids.add(i.id)});sel=ids;refresh()}});
const end=()=>{if(!drag)return;if(drag.m==='mv')drag.st.forEach(o=>{if(o.i.type==='pin'&&sel.has(o.i.id))o.i.at=hostAt({x:o.i.x+o.i.w/2,y:o.i.y+o.i.h/2})});drag=null;mq.style.display='none';vp.classList.remove('grab');save()};
vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end);
vp.addEventListener('dblclick',e=>{if(!e.target.closest('.item'))addNote('',toWorld(e.clientX,e.clientY))});
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect(),v=S.view;
 if(e.ctrlKey){const z0=v.z,z1=Math.min(4,Math.max(.1,z0*Math.exp(-e.deltaY*.0015))),px=e.clientX-r.left,py=e.clientY-r.top;v.x=px-(px-v.x)*z1/z0;v.y=py-(py-v.y)*z1/z0;v.z=z1}
 else{v.x-=e.deltaX;v.y-=e.deltaY}apply();save()},{passive:false});

// ---- images: paste & drop
document.addEventListener('paste',e=>{const cd=e.clipboardData;if(!cd)return;const files=[...cd.items].filter(i=>i.kind==='file'&&i.type.startsWith('image/')).map(i=>i.getAsFile());
 if(files.length){e.preventDefault();files.forEach(f=>addImg(f));return}
 if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.isContentEditable)return;
 const t=cd.getData('text');if(t){e.preventDefault();addNote(t)}});
vp.addEventListener('dragover',e=>e.preventDefault());
vp.addEventListener('drop',e=>{e.preventDefault();const p=toWorld(e.clientX,e.clientY);
 [...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach((f,i)=>addImg(f,{x:p.x+i*24,y:p.y+i*24}))});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>e.preventDefault());

// ---- keys
const typing=e=>/TEXTAREA|INPUT|SELECT/.test(e.target.tagName)||e.target.isContentEditable;
addEventListener('keydown',e=>{
 if(e.code==='Space'&&!typing(e)&&!space){space=true;vp.classList.add('grab');e.preventDefault()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveFile()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){e.preventDefault();$('#fOpen').click()}
 if(typing(e))return;
 if(tool==='select'&&!sel.size&&!space&&e.key.length===1&&e.key!==' '&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&$('#modal').style.display!=='flex'){
  e.preventDefault();const r=vp.getBoundingClientRect(),inV=mouse.x>=r.left&&mouse.x<=r.right&&mouse.y>=r.top&&mouse.y<=r.bottom,w=toWorld(inV?mouse.x:r.left+r.width/2,inV?mouse.y:r.top+r.height/2);
  addNote('',inV?{x:w.x+130,y:w.y+100}:w);document.execCommand('insertText',false,e.key);return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();setSel(S.items.map(i=>i.id))}
 if(e.key==='Delete'||e.key==='Backspace'){if(sel.size)del()}
 if(e.key==='Escape'){$('#modal').style.display='none';setSel([])}});
addEventListener('keyup',e=>{if(e.code==='Space'){space=false;if(tool!=='hand')vp.classList.remove('grab')}});

// ---- pins & red strings
const NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');
svg.setAttribute('style','position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:500000');
function hostAt(c){const l=S.items.filter(i=>i.type!=='pin'&&c.x>=i.x&&c.x<=i.x+i.w&&c.y>=i.y&&c.y<=i.y+i.h).sort((a,b)=>b.z-a.z);return l[0]?l[0].id:null}
function withPins(){const ids=new Set(sel);S.items.forEach(i=>{if(i.type==='pin'&&i.at&&sel.has(i.at))ids.add(i.id)});return[...ids]}
function drawStrings(){svg.innerHTML='';S.strings=S.strings.filter(s=>get(s.a)&&get(s.b));
 S.strings.forEach(s=>{const a=get(s.a),b=get(s.b),ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2,sag=Math.min(40,Math.hypot(bx-ax,by-ay)*.06);
  const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${ax} ${ay}Q${(ax+bx)/2} ${(ay+by)/2+sag} ${bx} ${by}`);
  p.setAttribute('style','fill:none;stroke:#d32f2f;stroke-width:1.6px;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.35))');svg.append(p)})}
const pm=$('#pm'),hidePm=()=>pm.style.display='none';let pair=null;
const linked=(a,b)=>S.strings.findIndex(s=>(s.a===a&&s.b===b)||(s.a===b&&s.b===a));
function pinMenu(e){hidePm();const l=[...sel].map(get);if(l.length!==2||l.some(i=>!i||i.type!=='pin'))return;e.preventDefault();pair=l.map(i=>i.id);
 $('#pTie').textContent=linked(pair[0],pair[1])>=0?'✂ Cut red string':'🧵 Tie red string';
 pm.style.display='block';pm.style.left=Math.max(4,Math.min(e.clientX,innerWidth-pm.offsetWidth-8))+'px';pm.style.top=Math.max(4,Math.min(e.clientY,innerHeight-pm.offsetHeight-8))+'px'}
$('#pTie').onclick=()=>{const i=linked(pair[0],pair[1]);if(i>=0)S.strings.splice(i,1);else S.strings.push({a:pair[0],b:pair[1]});hidePm();setSel([]);save()};

// ---- tabs
const tid=()=>'t'+Date.now()+Math.random().toString(36).slice(2,5);
function newTab(name,items,view){return{id:tid(),name,items:items||[],strings:[],view:view||{x:80,y:80,z:1}}}
function sync(){const t=S.tabs.find(t=>t.id===S.cur);if(t){t.items=S.items;t.view=S.view;t.strings=S.strings}}
function snapshot(){sync();return{tabs:S.tabs,cur:S.cur,n:S.n,cfg:S.cfg}}
function show(id){sync();const t=S.tabs.find(x=>x.id===id);S.cur=id;S.items=t.items;S.view=t.view;S.strings=t.strings=t.strings||[];
 world.innerHTML='';world.append(svg);dom={};sel=new Set();zTop=Math.max(1,...S.items.map(i=>i.z||0));S.items.forEach(mk);drawStrings();apply();renderTabs();save()}
function addTab(){const t=newTab('Board '+(++S.n));S.tabs.push(t);show(t.id)}
function closeTab(id){sync();const i=S.tabs.findIndex(t=>t.id===id);if(i<0)return;closed.push(S.tabs[i]);if(closed.length>10)closed.shift();S.tabs.splice(i,1);
 if(!S.tabs.length)S.tabs.push(newTab('Board '+(++S.n)));
 if(id===S.cur){S.cur=null;show(S.tabs[Math.min(i,S.tabs.length-1)].id)}else{renderTabs();save()}}
function renderTabs(){const b=$('#tabs');b.innerHTML='';
 S.tabs.forEach(t=>{const d=document.createElement('div');d.className='tab'+(t.id===S.cur?' on':'');
  const n=document.createElement('span');n.className='tn';n.textContent=t.name;
  const x=document.createElement('button');x.className='tx';x.textContent='✕';x.title='Close tab';x.onclick=e=>{e.stopPropagation();closeTab(t.id)};
  d.append(n,x);d.onclick=()=>{if(t.id!==S.cur)show(t.id)};
  d.onauxclick=e=>{if(e.button===1){e.preventDefault();closeTab(t.id)}};
  n.ondblclick=e=>{e.stopPropagation();n.contentEditable='true';n.focus();getSelection().selectAllChildren(n)};
  n.onblur=()=>{n.contentEditable='false';t.name=n.textContent.trim()||t.name;n.textContent=t.name;save()};
  n.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();n.blur()}e.stopPropagation()};
  b.append(d)});
 const p=document.createElement('button');p.className='b';p.id='tPlus';p.textContent='＋';p.title='New tab';p.onclick=addTab;b.append(p);
 $('#bUndo').style.display=closed.length?'':'none'}
$('#bUndo').onclick=()=>{const t=closed.pop();if(t){S.tabs.push(t);show(t.id)}};

// ---- right-click text formatting
const cm=$('#cm');let rng=null;
['#1a1a1a','#d13438','#ca5010','#107c10','#0067c0','#8764b8','#605e5c'].forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.title=c;b.dataset.col=c;$('#sws').append(b)});
const hideCm=()=>cm.style.display='none';
const hex=c=>{const m=/(\d+)\D+(\d+)\D+(\d+)/.exec(c||'');return m?'#'+[m[1],m[2],m[3]].map(n=>(+n).toString(16).padStart(2,'0')).join(''):(c||'').toLowerCase()};
function fstate(){const s=getSelection(),a=s.anchorNode,n=a&&(a.nodeType===1?a:a.parentElement);if(!n||!n.closest||!n.closest('.nb'))return null;
 const o={};['bold','italic','underline','strikeThrough'].forEach(c=>o[c]=document.queryCommandState(c));o.color=hex(document.queryCommandValue('foreColor'));return o}
function paintCm(){const st=fstate();cm.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',!!(st&&st[b.dataset.c])));
 cm.querySelectorAll('.sw').forEach(b=>b.classList.toggle('cur',!!st&&st.color===b.dataset.col))}
document.addEventListener('selectionchange',()=>{const st=fstate(),f=$('#sF');if(cm.style.display==='flex')paintCm();if(!st){f.innerHTML='';return}
 let h=(st.bold?'<b>B</b> ':'')+(st.italic?'<i>I</i> ':'')+(st.underline?'<u>U</u> ':'')+(st.strikeThrough?'<s>S</s> ':'');
 if(st.color&&st.color!=='#1a1a1a')h+=`<span class="dot" style="background:${st.color}"></span>`;
 f.innerHTML=h?'Format: '+h:''});
function fmt(cmd,val){const s=getSelection();if(rng){s.removeAllRanges();s.addRange(rng)}
 document.execCommand('styleWithCSS',false,true);document.execCommand(cmd,false,val);if(s.rangeCount)rng=s.getRangeAt(0).cloneRange();paintCm()}
vp.addEventListener('contextmenu',e=>{const nb=e.target.closest('.nb');if(!nb){hideCm();pinMenu(e);return}hidePm();e.preventDefault();nb.focus();
 const s=getSelection();rng=s.rangeCount?s.getRangeAt(0).cloneRange():null;
 paintCm();cm.style.display='flex';cm.style.left=Math.max(4,Math.min(e.clientX,innerWidth-cm.offsetWidth-8))+'px';cm.style.top=Math.max(4,Math.min(e.clientY,innerHeight-cm.offsetHeight-8))+'px'});
cm.addEventListener('mousedown',e=>{if(e.target.id!=='cc')e.preventDefault()});
cm.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.col)fmt('foreColor',b.dataset.col);else if(b.dataset.c)fmt(b.dataset.c)});
$('#cc').addEventListener('input',e=>fmt('foreColor',e.target.value));
document.addEventListener('pointerdown',e=>{if(!cm.contains(e.target))hideCm();if(!pm.contains(e.target))hidePm()},true);
addEventListener('keydown',e=>{if(e.key==='Escape'){hideCm();hidePm();if(tool==='pin')setTool('pin')}});addEventListener('wheel',()=>{hideCm();hidePm()},{passive:true});

// ---- toolbar
$('#bNote').onclick=()=>addNote('');
function setTool(t){tool=tool===t?'select':t;$('#bHand').classList.toggle('on',tool==='hand');$('#bPin').classList.toggle('on',tool==='pin');vp.classList.toggle('grab',tool==='hand'||space);vp.classList.toggle('pinmode',tool==='pin')}
$('#bHand').onclick=()=>setTool('hand');$('#bPin').onclick=()=>setTool('pin');
$('#bFit').onclick=()=>{S.view={x:80,y:80,z:1};apply();save()};
function saveFile(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(snapshot())],{type:'application/json'}));a.download='board.json';a.click()}
$('#bSave').onclick=saveFile;$('#bOpen').onclick=()=>$('#fOpen').click();
$('#fOpen').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t),ts=d.tabs&&d.tabs.length?d.tabs:[newTab(f.name.replace(/\.json$/i,'')||'Imported',d.items,d.view)];ts.forEach(x=>{x.id=tid();S.tabs.push(x)});show(ts[0].id)}catch(x){alert('Could not open that file.')}});e.target.value=''};
function load(d){S.cfg=Object.assign(S.cfg,d.cfg||{});
 S.tabs=d.tabs&&d.tabs.length?d.tabs:[newTab('Board 1',d.items,d.view)];S.n=d.n||S.tabs.length;S.cur=null;
 show(d.cur&&S.tabs.some(t=>t.id===d.cur)?d.cur:S.tabs[0].id);cfg();syncSet()}

// ---- settings
const map={cT:'theme',cB:'bg',cF:'ff'};
function syncSet(){const c=S.cfg;$('#cT').value=c.theme;$('#cB').value=c.bg;$('#cF').value=c.ff;$('#cS').value=c.fs;$('#cG').checked=c.snap;$('#cA').checked=c.auto}
$('#bSet').onclick=()=>{syncSet();$('#modal').style.display='flex'};
$('#bClose').onclick=()=>$('#modal').style.display='none';
$('#modal').onclick=e=>{if(e.target.id==='modal')e.target.style.display='none'};
for(const id in map)$('#'+id).onchange=e=>{S.cfg[map[id]]=e.target.value;cfg();save()};
$('#cS').onchange=e=>{S.cfg.fs=Math.min(48,Math.max(10,+e.target.value||16));cfg();save()};
$('#cG').onchange=e=>{S.cfg.snap=e.target.checked;save()};
$('#cA').onchange=e=>{S.cfg.auto=e.target.checked;if(e.target.checked)save();else try{localStorage.removeItem(KEY)}catch(x){}};
$('#bClear').onclick=()=>{if(confirm('Remove everything on the board?')){setSel(S.items.map(i=>i.id));del()}};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',cfg);

// ---- start
let d0=null;try{d0=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
load(d0||{});
</script></body></html>
